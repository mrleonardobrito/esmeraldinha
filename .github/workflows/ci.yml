name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        env:
          # O CI nunca inicia o Electron; só lint, typecheck e testes.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test
