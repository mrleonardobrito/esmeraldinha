name: Build Electron

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.version.outputs.value }}" >/dev/null 2>&1 || \
            gh release create "v${{ steps.version.outputs.value }}" \
              --draft \
              --title "v${{ steps.version.outputs.value }}" \
              --generate-notes

  build:
    needs: release-draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder bundles this Chromium at package time (see electron-builder.yml).
      - name: Download Playwright Chromium
        run: pnpm playwright:install
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

      # O login e a senha temporária da conta do auxiliar de ensino entram no
      # bundle aqui (electron/build-defines.mjs): o app instalado não lê .env.
      # Sem os secrets configurados, valem os padrões de server/env.ts.
      - name: Build and package (${{ matrix.target }})
        run: |
          pnpm build
          pnpm build:electron
          npx electron-builder --${{ matrix.target }} --publish always
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ESMERALDINHA_LOGIN: ${{ secrets.ESMERALDINHA_LOGIN }}
          ESMERALDINHA_SENHA_TEMPORARIA: ${{ secrets.ESMERALDINHA_SENHA_TEMPORARIA }}

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Precisa escrever de volta o bump de versão depois da release.
          persist-credentials: true

      - name: Read release version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ steps.version.outputs.value }}" --draft=false

      # Garante que o próximo merge na main não tente recriar a mesma tag.
      - name: Bump patch version for next release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          new_version=$(node -p "require('./package.json').version")
          git commit -am "chore: bump version to $new_version [skip ci]"
          git push
