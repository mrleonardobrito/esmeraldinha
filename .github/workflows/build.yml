name: Build Electron

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            artifact_glob: |
              release/*.AppImage
              release/*.deb
          - os: windows-latest
            target: win
            artifact_glob: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # electron-builder bundles this Chromium at package time (see electron-builder.yml).
      - name: Download Playwright Chromium
        run: pnpm playwright:install
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/pw-browsers

      - name: Build and package (${{ matrix.target }})
        run: |
          pnpm build
          pnpm build:electron
          npx electron-builder --${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: esmeraldinha-${{ matrix.target }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
